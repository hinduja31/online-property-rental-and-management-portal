
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏡 Property Rental Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .hero {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100svh;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            background-image: url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=2000&q=90");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.48);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 850px;
            color: white;
        }

        .hero-content h1 {
            font-size: 44px;
            margin-bottom: 20px;
            color: white;
        }

        .hero-content p {
            font-size: 20px;
            margin-bottom: 28px;
            color: white;
        }

        .explore-btn {
            display: inline-block;
            width: auto;
            padding: 12px 25px;
            background-color: #155443;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            transition: 0.3s ease;
        }

        .explore-btn:hover {
            background-color: #0d382d;
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            .hero-content h1 {
                font-size: 30px;
            }

            .hero-content p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="hero-content">

            <h1>Online Property Rental Portal</h1>

            <p>Find your perfect rental home.</p>

            <a href="{{ url_for('login') }}" class="explore-btn">
                Explore Properties
            </a>

        </div>

    </div>

</body>
</html>
