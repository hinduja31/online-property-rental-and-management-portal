<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏡User Registration</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/css/intlTelInput.css">

    <style>
        .phone-box {
            width: 100%;
            margin: 8px 0 15px;
        }

        .phone-box .iti {
            width: 100%;
        }

        .phone-box input {
            width: 100%;
            height: 45px;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .password-box {
            position: relative;
            width: 100%;
            margin: 8px 0 15px;
        }

        .password-box input {
            width: 100%;
            height: 45px;
            padding: 10px 45px 10px 12px;
            margin: 0;
        }

        .password-box button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #174C3C;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form method="POST" class="register-card" id="registerForm">

        <h1>Create Account</h1>

        {% if error %}
            <p class="error" style="color: red; margin-bottom: 15px;">{{ error }}</p>
        {% endif %}

        <input type="text"
               name="name"
               placeholder="Enter your Name"
               required>

        
        <input type="email"
               name="email"
               placeholder="Enter your Email"
               required>

        
        <div class="phone-box">
            <input type="tel"
                   id="mobileInput"
                   placeholder="Enter mobile number"
                   required>
        </div>

        <input type="hidden"
               name="mobile"
               id="fullMobile">

        
        <div class="password-box">

            <input type="password"
                   id="registerPassword"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="button"
                    onclick="togglePassword('registerPassword', this)">
                👁
            </button>

        </div>

        <div class="password-box">

            <input type="password"
                   id="confirm_password"
                   name="confirm_password"
                   placeholder="Confirm your password"
                   required>

            <button type="button"
                    onclick="togglePassword('confirm_password', this)">
                👁
            </button>

        </div>

        <select name="role" required>
            <option value="">Select Your Role</option>
            <option value="tenant">Tenant</option>
            <option value="owner">Property Owner</option>
        </select>

        
        <button type="submit">
            Create Account
        </button>

        <p class="register-login">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign In</a>
        </p>

    </form>

    
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/intlTelInput.min.js"></script>

    <script>
        
        const mobileInput = document.querySelector("#mobileInput");

        const iti = window.intlTelInput(mobileInput, {
            initialCountry: "in",
            separateDialCode: true,
            strictMode: true,
            utilsScript: "https://cdn.jsdelivr.net/npm/intl-tel-input@25.3.1/build/js/utils.js"
        });

        
        function togglePassword(id, button) {
            const password = document.getElementById(id);
            if (password.type === "password") {
                password.type = "text";
                button.textContent = "🙈";
            } else {
                password.type = "password";
                button.textContent = "👁";
            }
        }

        
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            if (!iti.isValidNumber()) {
                event.preventDefault();
                alert("Please enter a valid mobile number!");
                return;
            }

            document.getElementById("fullMobile").value = iti.getNumber();
        });
    </script>

</body>
</html>
