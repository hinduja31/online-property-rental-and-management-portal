
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏡Owner Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body.dashboard-page {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.30),
                    rgba(0, 0, 0, 0.30)
                ),
                url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=85");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .owner-navbar {
            width: 100%;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 20px;
            background: rgba(23, 76, 60, 0.96);
            z-index: 100;
        }

        .navbar-logo {
            color: white;
            font-size: 23px;
            font-weight: bold;
            text-align: center;
        }

        .menu-container {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .menu-button {
            border: none;
            background: transparent;
            color: white;
            font-size: 30px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .menu-button:hover {
            color: #C99B55;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            width: 190px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            overflow: hidden;
            z-index: 1000;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            display: block;
            padding: 13px 16px;
            color: #174C3C;
            text-decoration: none;
            font-weight: bold;
        }

        .dropdown-menu a:hover {
            background: #F5F1E8;
        }

        .owner-content {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
            padding-bottom: 30px;
            text-align: center;
        }

        .owner-content h1 {
            color: white;
            font-size: 30px;
            margin: 0 0 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .owner-content > p {
            color: white;
            font-size: 16px;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .owner-banner {
            display: none;
        }

        .owner-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .owner-grid .owner-card {
            min-height: 155px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 20px;

            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);

            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.15);

            text-decoration: none;
            color: #174C3C;

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .owner-grid .owner-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.98);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
        }

        .owner-grid .owner-card span {
            display: block;
            font-size: 36px;
            line-height: 1.2;
            margin: 0;
        }

        .owner-grid .owner-card h3 {
            margin: 0;
            padding: 0;
            text-align: center;
            font-size: 18px;
            color: #174C3C;
        }

        .owner-grid a.owner-card,
        .owner-grid a.owner-card:hover,
        .owner-grid a.owner-card:focus,
        .owner-grid a.owner-card span,
        .owner-grid a.owner-card h3 {
            text-decoration: none !important;
        }

        @media (max-width: 600px) {

            body.dashboard-page {
                background-attachment: scroll;
            }

            .owner-navbar {
                height: 60px;
            }

            .navbar-logo {
                font-size: 19px;
            }

            .menu-container {
                right: 10px;
            }

            .owner-content {
                width: 92%;
                margin: 25px auto;
            }

            .owner-content h1 {
                font-size: 24px;
            }

            .owner-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .owner-grid .owner-card {
                min-height: 125px;
            }
        }
    </style>
</head>

<body class="dashboard-page">

    <header class="owner-navbar">

        <div class="navbar-logo">
            🏡 Property Connect
        </div>

        <div class="menu-container">

            <button type="button"
                    class="menu-button"
                    onclick="toggleMenu()"
                    aria-label="Open menu"
                    aria-expanded="false"
                    id="menuButton">
                ☰
            </button>

            <div class="dropdown-menu" id="dropdownMenu">

                <a href="{{ url_for('profile') }}">
                    👤 Profile
                </a>

                <a href="{{ url_for('logout') }}">
                    🚪 Logout
                </a>

            </div>

        </div>

    </header>

    <main class="owner-content">

        <h1>Welcome, {{ user['name'] }}!</h1>

        <p>Manage your rental properties from here.</p>

        <section class="owner-grid">

            <a href="{{ url_for('owner_properties') }}"
               class="owner-card">
                <span>🏠</span>
                <h3>My Properties</h3>
            </a>

            <a href="{{ url_for('owner_section', section='applications') }}"
               class="owner-card">
                <span>📋</span>
                <h3>Applications</h3>
            </a>

            <a href="{{ url_for('owner_section', section='payments') }}"
               class="owner-card">
                <span>💰</span>
                <h3>Payments</h3>
            </a>

            <a href="{{ url_for('owner_section', section='complaints') }}"
               class="owner-card">
                <span>🔧</span>
                <h3>Complaints</h3>
            </a>

            <a href="{{ url_for('owner_section', section='tenants') }}"
               class="owner-card">
                <span>👥</span>
                <h3>Tenants</h3>
            </a>

            <a href="{{ url_for('owner_section', section='lease') }}"
               class="owner-card">
                <span>📄</span>
                <h3>Lease</h3>
            </a>

            <a href="{{ url_for('owner_section', section='maintenance') }}"
               class="owner-card">
                <span>🛠️</span>
                <h3>Maintenance</h3>
            </a>

            <a href="{{ url_for('owner_section', section='reports') }}"
               class="owner-card">
                <span>📊</span>
                <h3>Reports</h3>
            </a>

        </section>

    </main>

    <script>

        function toggleMenu() {

            const menu =
                document.getElementById("dropdownMenu");

            const button =
                document.getElementById("menuButton");

            menu.classList.toggle("show");

            button.setAttribute(
                "aria-expanded",
                menu.classList.contains("show")
            );

        }

        document.addEventListener("click", function(event) {

            const menuContainer =
                document.querySelector(".menu-container");

            const menu =
                document.getElementById("dropdownMenu");

            const button =
                document.getElementById("menuButton");

            if (!menuContainer.contains(event.target)) {

                menu.classList.remove("show");

                button.setAttribute("aria-expanded", "false");

            }

        });

    </script>

</body>
</html>
